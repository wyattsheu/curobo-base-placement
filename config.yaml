# ============================================================================
# 任務：上游已決定「抓什麼、夾爪最終位姿（位置＋朝向）」，但發現有障礙物而交給這裡。
#       這裡只做：根據 3D SLAM 地圖，決定 Kachaka 要移到哪裡，並確認移過去後用「那個夾爪位姿」還抓得到。
# 量到實際數值時，只需要改這個檔案。
#
# 座標系（右手系，公尺、弧度）：
#   map        SLAM 地圖座標（須與 Kachaka 定位的地圖相同）
#   base       Kachaka 目前所在位置：底盤中心投影到地面，x 朝車頭、z 朝上。規劃全部在這裡做，
#              虛擬關節 (x, y, ψ) = 「從現在的位置要移多少」
#   arm_base   Piper URDF 的 base_link
# ============================================================================

robot:
  # cuRobo 用的 Robot129 設定（碰撞球、URDF 路徑都在裡面），已隨專案放在 assets/，路徑相對於這個檔案。
  # yml 裡的 urdf_path / asset_root_path 相對於 yml 本身（robot_model.robot_dict 會換成絕對路徑）。
  curobo_yml: assets/robot129.yml
  tool_frame: pinch_center              # 上游給的「夾爪位姿」指的是這個 frame
  # pinch_center 在 gripper_base 前方多遠。實驗室 KachakaPiper 模型用 tool = SE3(0, 0, 0.12)
  # （mm_system reference/robotics-toolbox-python/.../KachakaPiper.py），上游的夾爪位姿就是這個點。
  tool_offset_m: 0.12

  # 座標原點 = kachaka_base_link：兩輪之間的轉軸、地面高度，x 朝車頭（實驗室 kachaka.xacro）。
  # Kachaka 回報的定位、Navigate_to_pose 的目標都是這一點。
  # 手臂（Piper base_link）裝在這個座標的哪裡：實驗室 kachaka_piper.urdf.xacro 的 piper_mount_joint，
  # 也是 mm_actions/motion/piper_kinematic.py 的 PIPER_MOUNT_IN_KACHAKA。手臂架在約 0.43 m 高的支架上。
  arm_mount_xyz: [0.08, 0.0, 0.525]
  arm_mount_rpy_deg: [0.0, 0.0, 0.0]

  # 實機護欄（mm_actions/actions/base_action.py）
  joint1_limit_rad: 0.6                 # J1_LIMIT_RAD
  bearing_limit_rad: 0.52               # SAFE_BEARING_RAD：目標方位須在手臂正面 ±30° 內

  # Kachaka 底盤碰撞模型（base 座標），取自實驗室 kachaka.xacro 的 collision box：0.387 × 0.240 × 0.095 m，中心在轉軸前 4.35 cm。
  # 只建底盤：停車檢查只問「底盤能不能停在那裡」（加上 Kachaka 2D 地圖的可行駛區域）；底盤上方的支架不另外建，
  # 碰撞只在規劃手臂時檢查（手臂的碰撞球在 robot129.yml）。
  kachaka:
    size_m: [0.387, 0.240, 0.095]       # 長(x)、寬(y)、高(z)
    body_center_xy: [0.0435, 0.0]       # 車身中心相對於轉軸（base 原點）
    sphere_radius: 0.045
    sphere_z: 0.060                     # 球心高度；球底離地 1.5 cm，不要讓球貼地（浮點誤差會讓碰撞判定亂跳）
    sphere_grid: [5, 2]                 # 沿 x 5 顆、沿 y 2 顆
    extra_spheres: []                   # ★ 機身上其他會撞到的東西，每顆球 [x, y, z, r]，base 座標

  # 開車時手臂收起的姿態（6 軸，弧度），也是到位後手臂軌跡的起點。用實驗室 mm_actions 夾到東西後的收起姿態
  # （actions/grasp.py 的 home_joint_state），夾爪在車頭前 0.22 m、離地 0.81 m。
  # 實驗室空手時的 home 是全零（place.py、handover.py），但那是完全折疊的姿態，robot129 的碰撞球在那裡互相重疊，
  # cuRobo 會判定起點自我碰撞而拒絕規劃。實機上先從全零移到這個姿態即可。null = 用 robot129.yml 的預設姿態。
  stow_arm: [0.0, 0.2, -0.6, 0.0, 0.8, 0.0]

search:
  # 虛擬關節的搜尋視窗（相對於目前位置）；再與 SLAM 已知區域取交集
  window_x: [-1.5, 1.5]
  window_y: [-1.5, 1.5]
  yaw_limit_rad: 3.14159

robustness:
  # 導航到位誤差：±xy、±yaw 各取三點（-, 0, +）共 27 種。← 用 Kachaka 實測誤差取代
  perturb_xy_m: 0.05
  perturb_yaw_deg: 5.0
  threshold: 1.0                        # 27 種都要抓得到才算通過
  min_accept: 0.5                       # 沒有站位達到 threshold 時，退路只接受穩健度 ≥ 這個值的站位；都不到就回報無解（reason = not_robust）

# 計算量（Thor 輕量設定：和其他程序共用 GPU）
profile:
  wb_seeds: 128                         # whole-body IK 種子數（只有一個夾爪位姿，一次呼叫）
  wb_rounds_max: 4                      # 候選太少時最多再解幾輪（每輪重新抽種子）
  min_candidates: 15                    # 可停車的候選站位至少要這麼多才開始評分
  scorer_group: 4                       # 評分：每次 GPU 呼叫評幾個站位（4 × 27 = 108 題）；方塊很多時自動減少
  scorer_seeds: 16
  planner_ik_seeds: 8
  planner_trajopt_seeds: 1
  collision_cache_cuboids: 64           # 場景方塊上限；地圖轉出來的方塊太多就加大

# 3D SLAM 地圖 → 障礙方塊（scene_io.py）
map:
  voxel_m: 0.04                         # 分群用的體素大小
  min_voxels: 4                         # 3D 連通塊少於這麼多個體素就當雜訊丟掉
  roi_radius_m: 1.8                     # 只把夾爪位置周圍這個半徑內的障礙放進 cuRobo（底盤和手臂都到不了更遠；省記憶體）
  floor_z_m: 0.03                       # 低於此高度的點視為地板（用來判斷已知區域），不當障礙
  known_band_m: [0.03, 0.60]            # 這個高度範圍內有點的格子也算「已知區域」
  known_close_cells: 2                  # 地板點之間的小空洞往外補幾格（點雲稀疏時）
  # 目標物本身不能當障礙。優先用 SLAM 標出的目標區域（request 的 target.mask_key）；
  # 只給類別時，取該類別在夾爪位置這個半徑內的點（同類別但較遠的物體仍是障礙）：
  target_object_radius_m: 0.20
  target_grow_m: 0.03                   # 緊貼目標物（3 cm 內、在它的高度範圍內）的點也算目標：分割在物體邊緣一定有誤差
  target_clear_radius_m: 0.07           # 兩者都沒有時的退路：以夾爪位置為中心的直立圓柱（這個半徑、上下各
  target_clear_half_height_m: 0.10      #   這個高度）內的點不當障礙。直立的小物體（罐子、瓶子）可以；大物體請給遮罩或類別
  box_xy_margin_m: 0.01                 # 方塊比點雲範圍外擴多少
  box_z_margin_m: 0.005
  # 同一個物體內頂面高度差超過這個值就分層、各自包方塊（桌面、擋板、櫃子黏在一起時不會被包成一個最高的大方塊）。
  # 沒有語意分類（只有點雲）時靠這個把物體分開。
  level_gap_m: 0.06
  box_fill: 0.7                         # 一個方塊至少要這麼滿（邊緣參差的物體不會被切碎）
  box_max_empty_m2: 0.04                # 一個方塊最多蓋住這麼多空地；超過就切開（兩個黏在一起的物體不會被包成一大塊）
  level_min_cells: 8                    # 一層至少要有一塊這麼多格（voxel_m 見方）相連的區域；零星的邊緣格併到上一層
